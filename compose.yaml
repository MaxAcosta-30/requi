# Solo para desarrollo local. La contraseña por defecto no protege nada real:
# el puerto se publica únicamente en 127.0.0.1.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: requi
      POSTGRES_USER: requi
      POSTGRES_PASSWORD: ${REQUI_DB_PASSWORD:-requi_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - requi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requi -d requi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  requi-db:
