name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # En main no se cancela: un despliegue no debe cortarse a la mitad.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Requi.slnx
      - run: dotnet build Requi.slnx -c Release --no-restore
      - run: dotnet test Requi.slnx -c Release --no-build
      - name: El contrato OpenAPI está al día
        # status, no diff: también detecta archivos nuevos sin seguimiento.
        run: git status --porcelain openapi/ | tee /dev/stderr | (! grep -q .)

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: requi
          POSTGRES_USER: requi
          POSTGRES_PASSWORD: requi_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U requi -d requi"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ConnectionStrings__Migrations: Host=localhost;Port=5432;Database=requi;Username=requi;Password=requi_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Aplicar scripts SQL
        run: dotnet run --project src/Requi.DbMigrator
      - name: Regenerar el scaffold
        run: database/scaffold.sh
      - name: El scaffold coincide con el código
        run: git status --porcelain src/ | tee /dev/stderr | (! grep -q .)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: El cliente del OpenAPI está al día
        run: |
          npm run api
          git status --porcelain src/app/api | tee /dev/stderr | (! grep -q .)
      - run: npm run build
      - run: npx ng test --watch=false

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: requi
          POSTGRES_USER: requi
          POSTGRES_PASSWORD: requi_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U requi -d requi"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REQUI_DB_PASSWORD: requi_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/e2e/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Flujo completo en el navegador
        # La clave de demo se genera aquí (el sufijo cumple la política de contraseñas) y nunca se guarda.
        # Playwright arranca la base, la API y Angular con tests/e2e/levantar.sh.
        run: |
          E2E_CLAVE="$(openssl rand -base64 18)-Aa1"
          echo "::add-mask::$E2E_CLAVE"
          export E2E_CLAVE
          npx playwright test
        working-directory: tests/e2e
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, database, frontend, e2e]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Aplicar scripts SQL en Neon
        env:
          ConnectionStrings__Migrations: ${{ secrets.NEON_MIGRATIONS_CONNECTION }}
          # URL del callback de Angular en Vercel (y localhost si se quiere), separadas por coma
          Oidc__Redirecciones: ${{ vars.OIDC_REDIRECCIONES }}
          Oidc__RedireccionesSalida: ${{ vars.OIDC_REDIRECCIONES_SALIDA }}
          # Contraseña de los usuarios de demo (caso 9); si falta, no se crean
          Demo__Clave: ${{ secrets.DEMO_CLAVE }}
        run: dotnet run --project src/Requi.DbMigrator
      - name: Desplegar la API en Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" > /dev/null
      - name: Desplegar el frontend en Vercel
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" > /dev/null
